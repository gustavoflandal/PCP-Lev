# So em producao (docker-compose.prod.yml), atras do Caddy: o IP do cliente
# vem no X-Forwarded-For que o Caddy define. O nginx nao tem porta publicada
# nesse arranjo, entao so o Caddy (rede interna do Compose) chega aqui.
# NAO use no docker-compose.yml de desenvolvimento, onde o nginx e publicado:
# ali um cliente da rede poderia forjar o proprio IP e escapar do limite de
# tentativas de login.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
