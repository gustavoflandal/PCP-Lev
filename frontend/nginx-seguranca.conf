# Cabecalhos de seguranca do SPA (doc 0, secao 4.7.6), incluidos em cada
# location que serve arquivos do frontend. Ficam num snippet, e nao no bloco
# "server", porque o add_header de um location ANULA todos os herdados do
# server -- antes, location /assets/ (que define Cache-Control) servia os
# bundles sem nenhum cabecalho de seguranca. O /api/ nao inclui: o backend ja
# manda os proprios cabecalhos, e duplicar (ex.: "X-Frame-Options: DENY,
# DENY") e tratado como valor invalido por alguns navegadores.
#
# CSP:
# - script-src 'self': sem script inline (o tema inicial vem de
#   /tema-inicial.js justamente por isso).
# - style-src 'unsafe-inline': o React aplica estilos via atributo style.
# - img-src data: blob:: previa de logotipo (FileReader) e downloads (CSV).
# - connect-src viacep.com.br: "Buscar CEP" em Dados da empresa.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://viacep.com.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Navegadores ignoram HSTS recebido por HTTP; passa a valer quando o
# sistema for servido por HTTPS (proxy/TLS de producao).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
