server {
  # Sem a versao do nginx nas respostas e paginas de erro.
  server_tokens off;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Os assets levam hash no nome: podem ser cacheados indefinidamente.
  location /assets/ {
    include /etc/nginx/snippets/seguranca.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A API e servida na mesma origem: sem CORS no navegador e sem embutir a
  # URL do backend no bundle. O nome "backend" resolve pela rede do Compose.
  # Sem o snippet de seguranca: o backend manda os proprios cabecalhos.
  location /api/ {
    # Upload de PDF tecnico ate 25 MB (v1.2); a API aplica o limite real.
    client_max_body_size 30m;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # SOBRESCREVE (nao anexa) o X-Forwarded-For com o IP real: a API confia
    # no XFF vindo de rede privada (ver IPExtractor em routes.go), e anexar
    # deixaria um cliente da LAN mandar um XFF falso, trocar de "IP" a cada
    # tentativa e escapar do limite de login e da auditoria.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota desconhecida devolve o index para o React Router.
  location / {
    include /etc/nginx/snippets/seguranca.conf;
    try_files $uri $uri/ /index.html;
  }
}
