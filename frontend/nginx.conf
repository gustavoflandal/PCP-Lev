server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabecalhos de seguranca basicos (RNF3 / OWASP).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # Os assets levam hash no nome: podem ser cacheados indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A API e servida na mesma origem: sem CORS no navegador e sem embutir a
  # URL do backend no bundle. O nome "backend" resolve pela rede do Compose.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota desconhecida devolve o index para o React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
