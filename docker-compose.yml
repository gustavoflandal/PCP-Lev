services:
  postgres:
    image: postgres:16-alpine
    container_name: pcp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pcp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_segura}
      POSTGRES_DB: ${DB_NAME:-pcp_db}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pcp_user} -d ${DB_NAME:-pcp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pcp_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pcp_user}
      DB_PASSWORD: ${DB_PASSWORD:-senha_segura}
      DB_NAME: ${DB_NAME:-pcp_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-troque_esta_chave_em_producao_min_32_caracteres}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      API_PORT: 8000
      API_ENV: ${API_ENV:-development}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:3010,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pcp_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3010}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
